model:
  scheduler:
    type: "euler_ancestral"  # Kullanılacak sampler tipi
  
  generation:
    width: 1024
    height: 576
    num_frames: 24           # Toplam kare sayısı
    fps: 8                   # Saniyedeki kare sayısı
    steps: 30                # Inference adım sayısı (kaliteyi artırır)
    guidance_scale: 5.5      # I2V için 5-6 arası optimal (7.5+ yüzü bozar)
    negative_prompt: "low quality, distortion, watermark, text, blurry, ugly, deformed face, bad anatomy, extra limbs, flickering, temporal inconsistency, jittery, noise, grain, overexposed, underexposed, cartoon, painting, illustration, disfigured, malformed hands"